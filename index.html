function jokerDef(j){return E.jokers.find(x=>x.id===j.id)||j}
function jokerHTML(j,i,context='owned'){const d=jokerDef(j);let hash=0;for(const c of String(j.id))hash+=c.charCodeAt(0);const ed=j.edition==='polychrome'?'poly':j.edition==='holographic'?'holo':j.edition;return `<button class="joker-card ${ed?'edition-'+esc(ed):''} ${j.disabled||j.permanentDisabled?'disabled-joker':''}" data-joker="${i}" data-context="${context}" aria-label="Inspect ${esc(d.name)}"><span class="joker-rarity">${esc(d.rarity||'Joker')}</span><span class="joker-emblem">${emblems[hash%emblems.length]}</span><span class="joker-name">${esc(d.name)}</span><span class="joker-stickers">${j.eternal?'<span title="Eternal: cannot be sold or destroyed">E</span>':''}${j.perishable?`<span title="Perishable: ${j.perishTally||0} rounds remaining">P${j.perishTally||0}</span>`:''}${j.rental?'<span title="Rental: costs $3 every played round">$3</span>':''}</span></button>`}
function baseTabs(){return `<nav class="tabbar" aria-label="Main sections">${[['decks','Choose a deck'],['collection','Collection'],['stats','Statistics'],['achievements','Achievements']].map(([id,t])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}">${t}</button>`).join('')}</nav>`}
function deckUnlocked(id){const i=E.decks.findIndex(d=>d.id===id);return i>=0&&(i<=1||(profile.deckWins[E.decks[i-1].id]||0)>0)}
function deckLockText(id){const i=E.decks.findIndex(d=>d.id===id);return i>1?'Win '+E.decks[i-1].name+' to unlock.':''}
function stakeList(){return E.stakes||[{id:'white',name:'White Stake',description:'Base difficulty.',index:0,colour:'#e4e3d8'}]}
function unlockedStakeIndex(id=deckId){return Math.min(stakeList().length-1,Math.max(0,(Number.isInteger(profile.deckStakeWins[id])?profile.deckStakeWins[id]:-1)+1))}
function chosenStake(){const all=stakeList(),s=all.find(x=>x.id===prefs.stake)||all[0];return s.index<=unlockedStakeIndex()?s:all[0]}
function renderHome(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Poker Table · Foundation build</div><h1>One more hand.<br><span>One better run.</span></h1><p>Build a deck that breaks the odds. Play poker hands, collect game-changing Jokers and take on eight Antes. Your next ridiculous combo starts here.</p><div class="hero-buttons">${run?btn('↗ Continue run','resume','primary'):btn('♠ Take a seat','focus-decks','primary')}${btn('How to play','help','ghost')}</div>${!storageOK?'<p class="inline-note">Storage is unavailable. Progress may not survive closing this page.</p>':''}</div><div class="hero-art" aria-hidden="true"><div class="hero-ring"></div>${cardHTML({id:'hero1',rank:14,suit:'S'},'art')}${cardHTML({id:'hero2',rank:13,suit:'H',edition:'holo'},'art')}${cardHTML({id:'hero3',rank:14,suit:'C',edition:'poly'},'art')}</div></section>${baseTabs()}<div id="home-content">${renderHomeTab()}</div>`}
function renderHomeTab(){if(tab==='decks'){const d=E.decks.find(x=>x.id===deckId)||E.decks[0];return `<div class="section-head"><h2>Find your starting edge.</h2><p>${E.decks.length} decks · ${stakeList().length} ${stakeList().length===1?'stake':'stakes'}</p></div><div class="deck-grid">${E.decks.map((d,i)=>`<button class="deck-tile ${deckId===d.id?'active':''} ${deckUnlocked(d.id)?'':'locked'}" data-deck="${esc(d.id)}" ${deckUnlocked(d.id)?'':'disabled'} title="${esc(deckUnlocked(d.id)?d.name:deckLockText(d.id))}" style="--deck-colour:${esc(d.colour||d.color||['#e99087','#82b7e8','#e6cd7f','#8ac3a1','#c7a7df'][i%5])}"><span class="deck-glyph">${['♠','♥','♣','♦','✦'][i%5]}</span><h3>${esc(d.name)}</h3><p>${esc(d.description)}</p>${!deckUnlocked(d.id)?`<small class="deck-lock-note">🔒 ${esc(deckLockText(d.id))}</small>`:''}${Number.isInteger(profile.deckStakeWins[d.id])?`<small class="deck-record">♛ ${esc(stakeList()[profile.deckStakeWins[d.id]]?.name||'White Stake')} won</small>`:''}</button>`).join('')}</div><div class="deck-selected"><div><strong>${esc(d.name)}</strong><p>${esc(d.description)} · 8 Antes / 24 blind slots</p></div><label class="stake-choice">Difficulty<select id="stake-select" aria-label="Stake difficulty">${stakeList().map(s=>`<option value="${s.id}" ${chosenStake().id===s.id?'selected':''} ${s.index>unlockedStakeIndex()?'disabled':''}>${esc(s.name)}${s.index>unlockedStakeIndex()?' · locked':''}</option>`).join('')}</select><small>${esc(chosenStake().description)}${chosenStake().index>0?' Includes earlier stake rules.':''}</small><small>Win to unlock the next stake for this deck.</small></label>${btn('Start new run →','new-run','primary')}</div><p class="build-note">Red and Blue start unlocked. Win the previous deck to unlock the next; stake progress is separate for each deck.</p>`}if(tab==='stats')return renderStats();if(tab==='achievements')return renderAchievements();return renderCollection()}
function renderStats(){const tiles=[['Runs started',fmt(profile.runs)],['Runs won',fmt(profile.wins)],['Best hand',fmt(profile.best)],['Highest Ante',fmt(profile.ante)],['Hands played',fmt(profile.hands)],['Discards used',fmt(profile.discards)],['Blinds beaten',fmt(profile.blinds)],['Money earned','$'+fmt(profile.money)]];return `<div class="section-head"><h2>Your table history.</h2><p>Saved on this browser</p></div><div class="stat-grid">${tiles.map(([k,v])=>`<div class="stat-box"><small>${k}</small><strong>${v}</strong></div>`).join('')}</div><div class="panel" style="margin-top:20px"><h3>Hands played</h3>${Object.keys(profile.handCounts).length?Object.entries(profile.handCounts).map(([k,v])=>`<div class="cashout-line"><span>${esc(handNames[k]||k)}</span><strong>${fmt(v)}</strong></div>`).join(''):'<p class="empty-message">Play your first hand to start your history.</p>'}</div>`}
function renderAchievements(){const list=window.BOAchievements||E.achievements||[];return `<div class="section-head"><h2>Milestones, not chores.</h2><p>${profile.achievements.length} earned · ${list.length} catalogued</p></div><p class="build-note">Vanilla achievement reference with ${supportedAchievements.size} local milestone checks. This is not Steam integration or exact vanilla eligibility: seeded runs also count locally. ${stakeList().length<8?'Higher stakes are still in development. ':''}Challenge and full-collection milestones stay reference-only until their required content is implemented.</p><div class="collection-grid">${list.map(a=>`<article class="collection-entry ${profile.achievements.includes(a.id)?'earned':''}"><div class="achievement-icon">${profile.achievements.includes(a.id)?'★':'☆'}</div><h3>${esc(a.name)}</h3><p>${esc(a.description)}</p><small>${profile.achievements.includes(a.id)?'Earned locally':supportedAchievements.has(a.id)?'Local tracking enabled':'Reference only · not implemented'}</small></article>`).join('')}</div>`}
function coinJokerCard(j){const item=LEVEL_RULES.coinUnlocks.find(x=>x.id===j.id);if(!j.requiresCoinUnlock||!item)return '';const owned=profile.progression.unlockedJokers.includes(j.id),enough=profile.progression.coinsHalf>=item.priceHalf,enabled=playerBuffs().faucet&&enough&&!owned;return `<div class="coin-unlock-card"><p>Permanent unlock · ${fmt(item.priceHalf/2)} coins</p><button class="btn ${owned?'ghost':'primary'} small" data-level-action="unlock-joker" data-id="${esc(j.id)}" ${enabled?'':'disabled'}>${owned?'✓ Unlocked':'Unlock · '+fmt(item.priceHalf/2)+' coins'}</button><small>${owned?'Can now appear in shops, packs and generators.':!playerBuffs().faucet?'Earn coins from the faucet at player level 25.':'Balance: '+fmt(profile.progression.coinsHalf/2)+' coins. Unlocking does not insert a free card into your run.'}</small></div>`}
function renderCollection(){const categories={jokers:'Jokers',planets:'Planets',tarots:'Tarot cards',spectrals:'Spectral cards',vouchers:'Vouchers',tags:'Skip tags',decks:'Decks',blinds:'Blinds',packs:'Booster packs',modifiers:'Enhancements, editions & seals'};let entries;if(collectionKind==='blinds')entries=[{id:'small',name:'Small Blind',description:'First blind of each Ante. Can be skipped for a tag.'},{id:'big',name:'Big Blind',description:'Second blind of each Ante. Can be skipped for a tag.'},...E.bosses];else if(collectionKind==='modifiers')entries=[...Object.entries(E.enhancements||{}).map(([id,description])=>({id,name:id[0].toUpperCase()+id.slice(1),description,discoveryKind:'enhancements'})),{id:'base',name:'Base edition',description:'No edition bonus.',discoveryKind:'editions'},...Object.entries(E.editions||{}).map(([id,description])=>({id,name:({holo:'Holographic',poly:'Polychrome'}[id]||id[0].toUpperCase()+id.slice(1)),description,discoveryKind:'editions'})),...Object.entries(E.seals||{}).map(([id,description])=>({id,name:id[0].toUpperCase()+id.slice(1)+' Seal',description,discoveryKind:'seals'}))];else entries=E[collectionKind]||[];const found=x=>(profile.discovery?.[x.discoveryKind||collectionKind]||[]).includes(x.id),acquired=entries.filter(found).length,list=entries.filter(j=>(j.name+' '+j.description).toLowerCase().includes(search.toLowerCase()));return `<div class="section-head"><h2>Your growing collection.</h2><p>${acquired} / ${entries.length} acquired</p></div><div class="catalog-controls"><select id="collection-kind" aria-label="Collection category">${Object.entries(categories).map(([id,name])=>`<option value="${id}" ${collectionKind===id?'selected':''}>${name}</option>`).join('')}</select><input class="search" id="catalog-search" aria-label="Search collection" placeholder="Search names or effects…" value="${esc(search)}"><span class="count">${list.length} results</span></div><p class="build-note">Entries are available content, not automatic discoveries. Acquiring a card or buying a voucher updates this ledger; viewing the catalog does not.${collectionKind==='jokers'&&E.jokers.length<150?' '+(150-E.jokers.length)+' additional Jokers are still in development.':''}</p><div class="collection-grid">${list.map(j=>`<article class="collection-entry ${found(j)?'earned':''}"><span class="meta-badge">${found(j)?'✓ Acquired':esc(j.rarity||categories[collectionKind])}</span><h3 style="margin-top:12px">${esc(j.name)}</h3><p>${esc(j.description)}</p>${collectionKind==='jokers'?coinJokerCard(j):''}</article>`).join('')||'<p class="empty-message">No matching entries.</p>'}</div>`}
function nativeIds(){const pool=run?.phase==='play'?run.hand:run?.cards||[];return pool.filter(c=>selected.includes(String(c.id))).map(c=>c.id)}
function canAfford(price){return run.money+(run.jokers.some(j=>j.id==='credit_card'&&!j.disabled)?20:0)>=price}
function safeBlind(s=run){try{return E.blindInfo(s)}catch(e){return {name:'Blind',description:'',target:s.target||0,reward:0}}}
function sidebar(){const b=safeBlind(),inShop=['shop','pack'].includes(run.phase),inRound=['play','cashout','won','lost'].includes(run.phase),target=(inRound?run.target:b.target)||b.target||0,displayScore=inRound?run.score:0;
const card=inShop?`<div class="blind-symbol" aria-hidden="true">♠</div><h2 class="shop-sidebar-title">SHOP</h2><p class="shop-sidebar-subtitle">Improve your run!!!</p>`:`<div class="tiny-label">${run.blindIndex===2?'BOSS BLIND':run.blindIndex===1?'BIG BLIND':'SMALL BLIND'} · ${esc((run.stake||'white').toUpperCase())}</div><div class="blind-symbol">${run.blindIndex===2?'✦':run.blindIndex===1?'◆':'♣'}</div><h2>${esc(b.name)}</h2><p>${esc(b.description||'Reach the target to advance.')}</p><div class="tiny-label">Score at least</div><div class="target">${fmt(target)}</div><div class="tiny-label" style="margin-top:12px">Round score</div><div class="score-total">${fmt(displayScore)}</div><div class="progress"><span style="width:${Math.min(100,100*(displayScore||0)/(target||1))}%"></span></div>`;
return `<aside class="sidebar"><section class="panel blind-panel ${inShop?'shop-summary':''}">${card}</section><div class="resource-grid"><div class="resource"><div class="tiny-label">Hands</div><strong style="color:var(--blue)">${fmt(run.hands??4)}</strong></div><div class="resource"><div class="tiny-label">Discards</div><strong style="color:var(--red)">${fmt(run.discards??3)}</strong></div><div class="resource cash"><div class="tiny-label">Bank</div><strong>$${fmt(run.money)}</strong></div></div><div class="round-meta"><span>ANTE <b>${fmt(run.ante)} / 8</b></span><span>ROUND <b>${fmt(run.round)}</b></span></div></aside>`}
function jokerTray(){const slots=run.jokerSlots||5;return `<section class="tray-wrap"><div class="tray-head"><span>Your Jokers</span><span>${fmt(run.jokers.length)} / ${fmt(slots)} · tap to inspect & move</span></div><div class="tray">${run.jokers.map((j,i)=>jokerHTML(j,i)).join('')}${Array.from({length:Math.max(0,Math.min(5,slots-run.jokers.length))},()=>'<div class="empty-slot" aria-hidden="true">+</div>').join('')}</div>${run.jokerReserve?.length?btn('Saved Jokers · '+fmt(run.jokerReserve.length),'view-reserve','ghost small'):''}</section>`}
function consumables(){return `<div><div class="tray-head"><span>Consumables</span><span>${run.consumables.length} / ${run.consumableSlots||2}</span></div><div class="consumable-bar">${run.consumables.map((c,i)=>`<button class="consumable ${esc(c.type||'planet')}" data-consumable="${i}">${esc(c.name)}<small>Tap to inspect / use</small></button>`).join('')||'<div class="empty-message" style="padding:10px">Your next useful trick belongs here.</div>'}</div></div>`}
function renderGame(){return `<div class="game-grid">${sidebar()}<div class="table-column">${jokerTray()}${renderPhase()}${consumables()}<div class="table-subnav">${btn('Run info','run-info','ghost small')}${btn('Deck · '+fmt(run.cards.length),'view-deck','ghost small')}${btn('Scoring log','score-log','ghost small')}${run.blindIndex===2&&run.phase==='play'?btn(run.metaBossDisableUsed?'Boss disable used':playerBuffs().bossDisable?'Disable Boss · once/run':'Boss disable · Level 12','disable-boss','ghost small',!playerBuffs().bossDisable||run.metaBossDisableUsed||run.bossDisabled||run.jokers.some(j=>j.id==='chicot'&&(E.isJokerActive?E.isJokerActive(j):!j.disabled))):''}${btn('Back to menu','menu','ghost small')}</div></div></div>`}
function renderPhase(){if(run.phase==='select')return renderBlinds();if(run.phase==='play')return renderPlay();if(run.phase==='cashout')return renderCashout();if(run.phase==='shop')return renderShop();if(run.phase==='pack')return renderPack();if(['won','lost'].includes(run.phase))return renderEnd();return '<div class="panel">Unknown phase. Return to menu and start a new run.</div>'}
function renderBlinds(){return `<section class="panel"><div class="section-head"><div><div class="eyebrow">Ante ${fmt(run.ante)}</div><h2 style="margin-top:8px">Pick your next move.</h2></div><span class="pill">${run.deckId} deck</span></div><div class="blind-choice-grid">${[0,1,2].map(i=>{const b=safeBlind({...run,blindIndex:i});const cur=i===run.blindIndex;return `<article class="blind-choice ${cur?'current':i<run.blindIndex?'done':''}"><div class="blind-symbol">${i===2?'✦':i===1?'◆':'♣'}</div><h3>${esc(b.name)}</h3><p>${esc(b.description||'Reach the target score.')}</p><div class="target">${fmt(b.target)}</div><div class="tiny-label" style="margin-top:8px">Reward $${b.reward||0}</div>${cur?btn('Play blind','start-blind','primary'):btn(i<run.blindIndex?'Passed':'Upcoming','none','',true)}${cur&&i<2?`<div class="tag-info">${esc(b.tag?.name||'Skip for a tag')}</div>${btn('Skip → tag','skip-blind','ghost small')}`:''}</article>`}).join('')}</div><p class="hint">Skipping trades this blind's payout and shop for its tag. Boss blinds cannot be skipped.</p></section>`}
function renderPlay(){const unknown=run.hand.some(c=>c.faceDown&&selected.includes(String(c.id)));let p={name:'Select a hand',chips:0,mult:0};try{if(selected.length&&!unknown)p=E.preview(run,nativeIds())}catch(e){}if(unknown)p={name:'Unknown hand · face down',chips:0,mult:0};const last=run.lastResult?.name?run.lastResult:null;return `<section class="table-surface"><div class="table-title"><div class="eyebrow">Build your hand</div><h2>${esc(p.name||'Select a hand')}</h2><div class="score-pair"><span class="chips-pill">${unknown?'?':fmt(p.chips)}</span><span style="color:var(--muted)">×</span><span class="mult-pill">${unknown?'?':fmt(p.mult)}</span></div><p>Base hand values · cards and Jokers apply when played</p></div><div class="hand-row">${run.hand.map((c,i)=>cardHTML(c,'hand',i)).join('')}</div><div class="hand-footer"><span class="selection-caption">${selected.length} / 5 selected · ${fmt(run.hand.length)} in hand · ${fmt(run.drawPile?.length||0)} to draw</span><div class="sort-buttons"><button data-action="sort-rank">Rank</button><button data-action="sort-suit">Suit</button></div></div><div class="game-actions">${btn('Play hand'+(selected.length?' · '+selected.length:''),'play','blue',!selected.length||selected.length>5||run.hands<=0)}${btn('Discard'+(selected.length?' · '+selected.length:''),'discard','danger',!selected.length||selected.length>5||run.discards<=0)}</div><p class="hint">Tap cards to select · hold any card to inspect · keep ×Mult after +Mult within the same scoring phase.</p></section>${last?`<button class="result-strip" data-action="score-log">Last: ${esc(last.name)} → <b>${fmt(last.total)}</b> <span style="float:right">Details ↗</span></button>`:''}`}
function renderCashout(){const payout=run.payout||{lines:[],total:0};return `<section class="panel win-glow"><div class="cashout"><div class="eyebrow">Blind defeated</div><h2 style="margin-top:12px">A well-played hand.</h2><p style="color:var(--muted)">${fmt(run.score)} points scored</p>${payout.lines.map(l=>`<div class="cashout-line"><span>${esc(l.label)}</span><strong>$${fmt(l.amount)}</strong></div>`).join('')}<div class="cashout-line total"><span>Your payout</span><strong>$${fmt(payout.total)}</strong></div>${payout.rentalCost?`<p class="inline-note">Rental fees: $${fmt(payout.rentalCost)} already charged to your bank. They will not be deducted again at cash out.</p>`:''}${btn('Cash out →','cashout','primary')}</div></section>`}
function renderShop(){const sh=run.shop||{items:[],packs:[]};return `<section class="panel"><div class="section-head"><div><div class="eyebrow">Improve your next hand</div><h2 style="margin-top:8px">The shop.</h2></div><div class="actions">${btn('Reroll · $'+fmt(sh.rerollCost||0),'reroll','ghost small',!canAfford(sh.rerollCost))}${btn('Next blind →','leave-shop','primary small')}</div></div><div class="shop-grid">${sh.items.map((item,i)=>`<article class="shop-item ${item.sold?'sold':''}">${item.type==='joker'?jokerHTML(item,i,'shop'):item.type==='card'&&item.card?cardHTML(item.card,'shop',i):`<div class="pack-glyph">${item.type==='planet'?'☀':item.type==='tarot'?'☽':'✦'}</div><h3>${esc(item.name)}</h3>`}<p>${esc(item.description||'Inspect to learn more.')}</p>${btn(item.sold?'Sold':'Buy · $'+fmt(item.price),'buy','primary small',item.sold||!canAfford(item.price),`data-index="${i}"`)}</article>`).join('')}</div><div class="shop-lower">${sh.voucher?`<article class="shop-item voucher ${sh.voucher.sold?'sold':''}"><div class="pack-glyph">▤</div><h3>${esc(sh.voucher.name)}</h3><p>${esc(sh.voucher.description)}</p>${btn(sh.voucher.sold?'Redeemed':'Redeem · $'+fmt(sh.voucher.price),'buy-voucher','small',sh.voucher.sold||!canAfford(sh.voucher.price))}</article>`:'<div class="shop-item"><p>No voucher available.</p></div>'}<div class="shop-grid">${sh.packs.map((p,i)=>`<article class="shop-item ${p.sold?'sold':''}"><div class="pack-glyph">${p.name?.includes('Celestial')?'☀':p.name?.includes('Arcana')?'☽':'▣'}</div><h3>${esc(p.name)}</h3><p>${esc(p.description||'Open and choose cards.')}</p>${btn(p.sold?'Opened':'Open · $'+fmt(p.price),'open-pack','small',p.sold||!canAfford(p.price),`data-index="${i}"`)}</article>`).join('')}</div></div><p class="hint">Rerolls replace shelf cards only—not packs or vouchers. Tap a Joker to inspect its exact effect.</p></section>`}
function renderPack(){const p=run.pack;if(!p)return '<section class="panel">Pack unavailable.</section>';return `<section class="panel"><div class="section-head"><div><div class="eyebrow">Choose ${p.remaining}</div><h2 style="margin-top:8px">${esc(p.name)}</h2></div>${btn('Skip remaining','skip-pack','ghost small')}</div><div class="shop-grid">${p.choices.map((c,i)=>c.chosen||c.taken||c.sold?'':`<article class="shop-item">${c.type==='joker'?jokerHTML(c,i,'pack'):c.card?cardHTML(c.card,'pack',i):'<div class="pack-glyph">✦</div>'}<h3>${esc(c.name||'Playing card')}</h3><p>${esc(c.description||(c.card?E.describeCard(c.card):''))}</p>${btn('Choose','choose-pack','primary small',false,`data-index="${i}"`)}</article>`).join('')}</div></section>`}
function renderEnd(){const won=run.phase==='won';return `<section class="panel end-screen"><div class="end-icon">${won?'♛':'♠'}</div><div class="eyebrow">${won?'Ante 8 conquered':'Every run teaches you something'}</div><h1>${won?'You broke the odds.':'Another hand awaits.'}</h1><p>${won?'Eight Antes down. Your deck has earned its victory.':'Your run is saved in your statistics. Try a new deck or a new approach.'}</p><div class="stat-grid"><div class="stat-box"><small>Best hand</small><strong>${fmt(run.stats?.bestHand||run.lastResult?.total||0)}</strong></div><div class="stat-box"><small>Ante reached</small><strong>${fmt(run.ante)}</strong></div><div class="stat-box"><small>Hands played</small><strong>${run.stats?.handsPlayed||0}</strong></div><div class="stat-box"><small>Final bank</small><strong>$${fmt(run.money)}</strong></div></div><div class="hero-buttons">${won?btn('Continue in endless →','endless','primary'):''}${btn('Choose a new deck','menu',won?'ghost':'primary')}</div></section>`}
function render(){if(!PG){$('#app').innerHTML='<div class="panel"><h2>The player-level module is missing.</h2><p>Keep progression.js next to the source files, or open the complete standalone HTML.</p></div>';return}if(!E){$('#app').innerHTML='<div class="panel"><h2>The engine is missing.</h2><p>Keep engine.js next to index.html, or open the standalone HTML file.</p></div>';return}document.body.classList.toggle('reduced-motion',!prefs.motion);$('#app').innerHTML=page==='home'?renderHome():renderGame();refreshProgressPresentation()}
function modal(title,html){lastFocus=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;$('#overlay').hidden=false;$('.sheet').scrollTop=0;$('.sheet').focus({preventScroll:true})}
function closeModal(){suppressClickUntil=0;suppressedCardId=null;$('#overlay').hidden=true;$('#dialog-body').innerHTML='';if(lastFocus?.isConnected)lastFocus.focus()}
function inspectCard(id,context){let c;if(context==='hand')c=run?.hand.find(c=>String(c.id)===String(id));else c=run?.cards.find(c=>String(c.id)===String(id));if(!c)return;if(c.faceDown){modal('Face-down card','<p>This Boss has hidden the card. Its rank, suit and modifiers stay hidden until it is revealed.</p>');return}const index=run.hand.findIndex(x=>x.id===c.id);modal((ranks[c.rank]||c.rank)+' '+(suits[c.suit]||'')+(c.enhancement?' · '+c.enhancement:''),`<div class="inspect-art">${cardHTML(c,'inspect')}</div><p>${esc(E.describeCard(c))}</p><div class="row">${c.edition?`<span class="meta-badge">${esc(c.edition)}</span>`:''}${c.seal?`<span class="meta-badge">${esc(c.seal)} seal</span>`:''}</div>${context==='hand'?`<div class="sheet-actions">${btn(selected.includes(String(c.id))?'Deselect card':'Select card','toggle-inspected','primary',false,`data-id="${esc(c.id)}"`)}${btn('← Move left','move-card','ghost',index<=0,`data-index="${index}" data-dir="-1"`)}${btn('Move right →','move-card','ghost',index>=run.hand.length-1,`data-index="${index}" data-dir="1"`)}</div>`:''}`)}
function inspectJoker(index,context){let j;if(context==='owned')j=run.jokers[index];else if(context==='shop')j=run.shop.items[index];else if(context==='pack')j=run.pack.choices[index];if(!j)return;const d=jokerDef(j);let counters=Object.entries(j).filter(([k,v])=>typeof v==='number'&&!['price','uid'].includes(k)).map(([k,v])=>`${k}: ${fmt(v)}`).join(' · ');modal(d.name,`<div class="inspect-art">${jokerHTML(j,index,'inspect')}</div><p>${esc(d.description||j.description)}</p>${j.permanentDisabled?'<p class="inline-note">Expired Perishable: its ability is permanently inactive.</p>':j.disabled?'<p class="inline-note">Disabled for this Blind: its scoring ability is inactive.</p>':''}${j.eternal?'<p class="inline-note">Eternal: cannot be sold or destroyed.</p>':''}${j.perishable?`<p>Perishable: ${j.perishTally||0} played rounds before the ability expires.</p>`:''}${j.rental?'<p>Rental: costs $3 at the end of each played round, even if disabled or out of money.</p>':''}${Number.isInteger(profile.jokerStakeWins[j.id])?`<p>Highest previous win: ${esc(stakeList()[profile.jokerStakeWins[j.id]]?.name||'White Stake')}.</p>`:''}<span class="meta-badge">${esc(d.rarity||'Joker')}</span>${j.edition?`<span class="meta-badge">${esc(j.edition)}</span>`:''}${counters?`<p>${esc(counters)}</p>`:''}${context==='owned'?`<div class="sheet-actions">${btn('← Move left','move-joker','ghost',index===0,`data-index="${index}" data-dir="-1"`)}${btn('Move right →','move-joker','ghost',index===run.jokers.length-1,`data-index="${index}" data-dir="1"`)}${btn(j.eternal?'Eternal · cannot sell':'Sell · $'+(E.sellValue?E.sellValue(j):'?'),'sell-joker','danger',!!j.eternal,`data-index="${index}"`)}</div><p class="hint">Moving changes order. Selling is permanent for this run.</p>`:''}`)}
function inspectConsumable(i){const c=run.consumables[i];if(!c)return;modal(c.name,`<div class="pack-glyph" style="text-align:center">${c.type==='planet'?'☀':'☽'}</div><p>${esc(c.description)}</p><p class="inline-note">${selected.length?selected.length+' card(s) currently selected as targets.':'If this card needs targets, close this sheet and select cards in your hand first.'}</p><div class="sheet-actions">${btn('Use '+esc(c.name),'use-consumable','primary',false,`data-index="${i}"`)}${btn('Sell · $'+(E.sellValue?E.sellValue(c):'?'),'sell-consumable','danger',false,`data-index="${i}"`)}</div>`)}
function help(){modal('The rules of the table',`<p>Score enough points before your hands run out. A run has <b>8 Antes × 3 blinds</b>: Small, Big and Boss. Beat Ante 8's Boss to win.</p><ol><li>Tap 1–5 cards, then <b>Play hand</b>. Only cards belonging to the poker hand normally score.</li><li>Discard up to five cards at a time to look for a better hand.</li><li>Score = <b>Chips × Mult</b>. Planets level up hands; Jokers change how you score.</li><li>After a win, cash out and improve your deck at the shop. Skipping Small/Big trades the round and shop for a tag.</li><li>Bosses have special rules. Read them before committing.</li></ol><p><b>Controls:</b> Tap a Joker to inspect. Hold a playing card for its details. Use the inspection sheet's arrows to reorder. Press I on a focused card to inspect it. Sort buttons reorder your hand.</p><p><b>Scoring order:</b> before-play effects → scoring cards and their retriggers → held-in-hand effects → independent Jokers. +Mult before ×Mult helps only when the effects share a timing window.</p><p><b>Audio:</b> The first tap enables original lounge music and card/scoring sounds. Tap the music button or press M to mute; Settings has separate music/effects controls and volume sliders. There are no audio downloads.</p><p><b>Save:</b> Progress and statistics save automatically in this browser. Download/export a backup in Settings. This is a single-player, local-first foundation—not multiplayer or an official Balatro product.</p>`)}

function toggleCard(id){if(animating)return;if(!run||!['play','shop','select','pack'].includes(run.phase))return;id=String(id);const wasSelected=selected.includes(id);if(wasSelected)selected=selected.filter(x=>x!==id);else if(selected.length<5)selected.push(id);else{toast('You can select up to five cards.');return}window.BOAudio?.sfx(wasSelected?'deselect':'select',{pitch:Math.max(0,selected.length-1),intensity:.65});render()}
function dispatchClick(event){const el=event.target.closest('button');if(!el||el.disabled)return;if(animating&&el.dataset.action!=='skip-animation')return;if(Date.now()<suppressClickUntil&&el.dataset.card===suppressedCardId)return;const action=el.dataset.action;if(action&&handlers[action]){handlers[action](el);return}if(el.dataset.tab){tab=el.dataset.tab;search='';render();return}if(el.dataset.deck){deckId=el.dataset.deck;render();return}if(el.dataset.joker!==undefined){inspectJoker(Number(el.dataset.joker),el.dataset.context);return}if(el.dataset.card!==undefined){if(el.dataset.context==='hand')toggleCard(el.dataset.card);else if(el.dataset.context==='deck'){if(run.phase!=='play'){toggleCard(el.dataset.card);handlers['view-deck']()}else inspectCard(el.dataset.card,el.dataset.context);}return}if(el.dataset.consumable!==undefined)inspectConsumable(Number(el.dataset.consumable));}
